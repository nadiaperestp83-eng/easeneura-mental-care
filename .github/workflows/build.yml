name: Build APK

# Roda automaticamente a cada push nas branches principais e também
# manualmente pela aba "Actions" do GitHub (workflow_dispatch).
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  build:
    name: Analisar, testar e gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java (necessário para build Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Recriar SÓ a pasta android/ (preservando lib/ e pubspec.yaml)
        # Mesmo ajuste usado no fork anterior: se a pasta android/ deste
        # repositório estiver com um projeto Gradle antigo, incompatível com
        # o plugin de Gradle do Flutter atual, este passo regenera só a
        # pasta android/. `flutter create --overwrite` sobrescreve o projeto
        # inteiro (lib/main.dart, pubspec.yaml, test/), por isso fazemos
        # backup do nosso código antes e restauramos depois.
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/lib
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          flutter create --platforms=android --project-name ease_neura --overwrite .
          rm -rf lib pubspec.yaml
          cp -r /tmp/backup/lib lib
          cp /tmp/backup/pubspec.yaml pubspec.yaml

      - name: Instalar dependências (flutter pub get)
        run: flutter pub get

      - name: Analisar código (flutter analyze)
        run: flutter analyze
        continue-on-error: true # não trava o build por causa de warnings/lints

      - name: Rodar testes (flutter test)
        run: flutter test
        continue-on-error: true # remova esta linha quando os testes estiverem estáveis

      - name: Gerar APK de release
        # A chave nunca é escrita em nenhum arquivo do repositório: ela é
        # injetada só nesta etapa, direto do GitHub Secrets, via
        # --dart-define. Isso a compila dentro do binário do app, sem deixar
        # rastro em texto puro no código-fonte ou nos logs do Actions
        # (secrets do GitHub são automaticamente mascarados nos logs).
        run: |
          flutter build apk --release \
            --dart-define=OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}

      - name: Publicar o APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
